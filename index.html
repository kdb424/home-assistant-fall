<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home Assistant Fall Mode</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(#f7e7d3, #d9a066);
        font-family: system-ui, sans-serif;
        color: #3b2f2f;
      }
      .controls {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        display: flex;
        gap: 0.5rem;
        z-index: 10000;
      }
      button {
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 0.5rem;
        background: #8b4513;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1 style="padding:2rem">Home Assistant Fall Mode (demo)</h1>
    <div class="controls">
      <button id="toggle">Toggle</button>
      <button id="dark">Dark</button>
      <button data-season="auto">Auto</button>
      <button data-season="fall">Fall</button>
      <button data-season="spring">Spring</button>
      <button data-season="summer">Summer</button>
      <button data-season="winter">Winter</button>
    </div>
    <ha-leaves id="leaves"></ha-leaves>
    <script type="module">
      import "./ha-leaves.js";
      const leaves = document.getElementById("leaves");
      document.getElementById("toggle").addEventListener("click", () => {
        leaves.enabled = !leaves.enabled;
      });
      document.getElementById("dark").addEventListener("click", () => {
        leaves.darkMode = !leaves.darkMode;
        document.body.style.background = leaves.darkMode
          ? "linear-gradient(#1a1a2e, #16213e)"
          : "linear-gradient(#f7e7d3, #d9a066)";
      });
      document.querySelectorAll("button[data-season]").forEach((btn) => {
        btn.addEventListener("click", () => {
          leaves.season = btn.dataset.season;
        });
      });
    </script>
  </body>
</html>
